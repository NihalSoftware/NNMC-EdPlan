[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edplan-fastapi"
version = "0.1.0"
description = "FastAPI backend for EdPlan platform"
authors = [{ name = "NNMC Student Planning Hub Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.7.0",
  "PyJWT[crypto]>=2.10.1",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.2.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.2",
  "twilio>=9.3.4",
  "langgraph>=0.2.60",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "ruff>=0.7.3",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pip-audit>=2.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["passlib.*", "twilio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
